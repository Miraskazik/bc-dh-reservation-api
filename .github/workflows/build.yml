name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # jen kvůli mvn deploy na push do main
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # server-id musí odpovídat <distributionManagement><repository><id> v pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # PR: build = openapi-generator vygeneruje klienta + server stub z openapi.yaml
      # a zkompiluje je → nevalidní spec build shodí (implicitní validace kontraktu).
      - name: Build & verify (PR)
        if: github.event_name == 'pull_request'
        run: mvn -B verify

      # Push do main: publikuj jen když verze z pom.xml v Packages ještě není.
      # GitHub Packages release verzi nepřepisuje — opakovaný deploy stejné verze
      # skončí 409 Conflict. Nová verze = bump <version> v pom.xml.
      - name: Deploy to GitHub Packages (main)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate
          GROUP=$(mvn -B -q $HELP -Dexpression=project.groupId -DforceStdout)
          ARTIFACT=$(mvn -B -q $HELP -Dexpression=project.artifactId -DforceStdout)
          VERSION=$(mvn -B -q $HELP -Dexpression=project.version -DforceStdout)
          POM_URL="https://maven.pkg.github.com/${{ github.repository }}/${GROUP//.//}/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "$POM_URL")
          case "$CODE" in
            200|302)
              echo "::notice::$ARTIFACT:$VERSION už v GitHub Packages je — deploy přeskočen. Nová verze = bump <version> v pom.xml."
              mvn -B verify
              ;;
            404)
              mvn -B deploy
              ;;
            *)
              echo "::warning::Nečekaná odpověď registru (HTTP $CODE) — zkouším deploy naslepo."
              mvn -B deploy
              ;;
          esac
